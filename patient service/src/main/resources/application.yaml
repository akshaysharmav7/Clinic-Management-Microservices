spring:
  application:
    name: patient-service

  datasource:
    url: jdbc:postgresql://localhost:5434/patient_db
    username: patient
    password: patient

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka